<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dental Booking Demo</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fb; margin:0; color:#1b2440; }
    .wrap { max-width:900px; margin:0 auto; padding:48px 20px 120px; }
    .hero { background:white; border-radius:24px; padding:40px; box-shadow:0 20px 60px rgba(19,39,82,.08); }
    h1 { margin:0 0 12px; font-size:42px; }
    p { color:#5a6785; line-height:1.6; }
    .script-box { margin-top:20px; background:#0f172a; color:#e2e8f0; padding:16px; border-radius:14px; overflow:auto; }
    .cta { display:inline-block; margin-top:18px; padding:12px 18px; border-radius:999px; background:#2563eb; color:white; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Dental Booking Widget Demo</h1>
      <p>This demo asks for name, email, phone, then shows real available time slots from Google Calendar and books the selected slot instantly.</p>
      <div class="script-box">&lt;script src="https://your-domain.com/widget.js"&gt;&lt;/script&gt;</div>
      <a class="cta" href="#" onclick="alert('Use the widget at the bottom right.'); return false;">Open Widget</a>
    </div>
  </div>
  <script src="/widget.js"></script>
</body>
</html>
